name: smartspend
description: "Production-grade, privacy-first Flutter personal-finance app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Local Encrypted Database & Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Cryptography & Hashing
  crypto: ^3.0.3
  uuid: ^4.4.0

  # Navigation
  go_router: ^14.2.0

  # Charts & Visualization
  fl_chart: ^0.68.0

  # Security & Biometrics
  local_auth: ^2.2.0

  # Dates & Formatting
  intl: ^0.19.0

  # Utilities
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - test/fixtures/
