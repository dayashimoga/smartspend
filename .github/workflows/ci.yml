name: SmartSpend CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  quality-and-test:
    name: Quality Gates & Forensic Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Code Format Check
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis (--fatal-infos --fatal-warnings)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Mandatory Golden SMS Fixture Regressions (100% PASS)
        run: flutter test test/unit/parsers/golden_sms_test.dart

      - name: Full Test Suite with Coverage
        run: flutter test --coverage

      - name: Enforce Whole-Project Coverage Quality Gate (>90%)
        run: dart run scripts/calculate_coverage.dart

      - name: Automated Security, Secrets & SBOM Audit
        run: dart run scripts/security_audit.dart

      - name: Generate Requirements Traceability & Forensic Reports
        run: dart run scripts/generate_reports.dart

      - name: Upload Verification & Forensic Reports
        uses: actions/upload-artifact@v4
        with:
          name: smartspend-verification-reports-${{ github.sha }}
          path: |
            reports/
            coverage/lcov.info

  build-android:
    name: Build Android Binaries & Validate Shrinking
    needs: quality-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release App Bundle (AAB with R8 code shrinking)
        run: flutter build appbundle --release

      - name: Generate Checksums (SHA256SUMS)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/smartspend-release.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/smartspend-release.aab
          cd dist
          sha256sum smartspend-release.apk smartspend-release.aab > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release Binaries & Checksums
        uses: actions/upload-artifact@v4
        with:
          name: smartspend-binaries-${{ github.sha }}
          path: dist/

  smoke-test:
    name: Release APK Headless Emulator Smoke Test
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          name: smartspend-binaries-${{ github.sha }}
          path: dist/

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator & Verify Clean Launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install dist/smartspend-release.apk
            adb shell am start -n com.smartspend.app/.MainActivity
            sleep 10
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity"

